# cronwatcher example configuration

check_interval: 60  # seconds between missed-job checks

heartbeat:
  enabled: true
  host: "0.0.0.0"
  port: 8765
  # Cron jobs call: GET http://<host>:<port>/ping/<job_name>

jobs:
  - name: daily_backup
    schedule: "0 2 * * *"  # 02:00 every day
    grace_seconds: 300
    command: /usr/local/bin/backup.sh

  - name: hourly_sync
    schedule: "0 * * * *"
    grace_seconds: 120

  - name: every_minute_health
    schedule: "* * * * *"
    grace_seconds: 90

alert:
  enabled: false
  smtp_host: smtp.example.com
  smtp_port: 587
  smtp_tls: true          # use STARTTLS (recommended)
  smtp_user: ""           # leave blank if no auth required
  smtp_password: ""       # leave blank if no auth required
  from_addr: cronwatcher@example.com
  recipients:
    - ops@example.com
    - oncall@example.com
